# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
project:
  title: "Cryptographic Hardware accelerator "            
  team: "A10 CryptoAccel"                     
  discord: " lakvlsi_90908, zysteresis , TarunRS05"                 
  description: "ASCON AEAD 128a based Cryptographic Hardware Accelerator for Root of Trust application"  
  lvs_config: "lvs_config.json"

pins:
  - name: VSS          # this gets connected to dvss_pads
    io_type: ground
  - name: VDD         # this gets connected to dvdd_pads
    io_type: power
  - name: clk          # bidir[12].pad
    io_type: bidirectional_24ma
  - name: rst_n        # bidir[13].pad
    io_type: bidirectional_24ma
  - name: sclk         # bidir[14].pad
    io_type: bidirectional_24ma
  - name: mosi         # bidir[15].pad
    io_type: bidirectional_24ma
  - name: cs_n         # bidir[16].pad
    io_type: bidirectional_24ma
  - name: miso         # bidir[17].pad
    io_type: bidirectional_24ma
  
  
