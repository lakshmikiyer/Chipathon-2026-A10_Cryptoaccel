meta:
  version: 3
  flow: Chip
  substituting_steps:

    # IllegalOverlap bug with PDN halo
    Checker.IllegalOverlap: null

    # Disable KLayout DRC
    #KLayout.DRC: null
    #Checker.KLayoutDRC: null

    # Disable KLayout antenna check
    #KLayout.Antenna: null
    #Checker.KLayoutAntenna: null

    # Disable KLayout density check
    #KLayout.Density: null
    #Checker.KLayoutDensity: null

    # Save time during development
    # Enable for sign-off
    #OpenROAD.IRDropReport: null
    #Magic.DRC: null
    #Checker.MagicDRC: null
    #KLayout.XOR: null
    #Netgen.LVS: null
    #Checker.LVS: null

DESIGN_NAME: chip_top
VERILOG_FILES:
- dir::../src/chip_top.sv
- dir::../src/chip_core.sv

# Enable plugin for better SystemVerilog support
# USE_SLANG: True
# SLANG_ARGUMENTS: ['--keep-hierarchy']

# Slightly smaller file sizes
PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# SDC files
PNR_SDC_FILE: dir::chip_top.sdc
SIGNOFF_SDC_FILE: dir::chip_top.sdc
FALLBACK_SDC: dir::chip_top.sdc

# Power / ground nets
VDD_NETS:
- VDD
GND_NETS:
- VSS


DEFAULT_CORNER: max_ss_125C_3v00 # default use worst corner
STA_CORNERS:
  - nom_tt_025C_3v30
  - min_ff_n40C_3v60
  - max_ss_125C_3v00
LIB:
  "*_tt_025C_3v30":
    - pdk_dir::libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__tt_025C_3v30.lib
    - pdk_dir::libs.ref/gf180mcu_fd_io/lib/gf180mcu_fd_io__tt_025C_3v30.lib
    - pdk_dir::libs.ref/gf180mcu_fd_io/lib/gf180mcu_ws_io__tt_025C_5v00.lib
  "*_ss_125C_3v00":
    - pdk_dir::libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__ss_125C_3v00.lib
    - pdk_dir::libs.ref/gf180mcu_fd_io/lib/gf180mcu_fd_io__ss_125C_2v97.lib
    - pdk_dir::libs.ref/gf180mcu_fd_io/lib/gf180mcu_ws_io__ss_125C_4v50.lib
  "*_ff_n40C_3v60":
    - pdk_dir::libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__ff_n40C_3v60.lib
    - pdk_dir::libs.ref/gf180mcu_fd_io/lib/gf180mcu_fd_io__ff_n40C_3v63.lib
    - pdk_dir::libs.ref/gf180mcu_fd_io/lib/gf180mcu_ws_io__ff_n40C_5v50.lib

# We need to add gf180mcu_fd_io__bi_24t
# due to the unused Y output for output only pads
IGNORE_DISCONNECTED_MODULES:
- gf180mcu_fd_io__bi_24t
# - gf180mcu_ws_ip__id
# - gf180mcu_ws_ip__logo

# Clock
CLOCK_PORT: "bidir_PAD[12]"
# CLOCK_NET must point at the pad cell OUTPUT pin, not the pad itself.
# Find the exact instance name in src/chip_top.sv (the bidir generate block),
# e.g.  grep -n "bi_24t" src/chip_top.sv
#CLOCK_NET: "bidir_pad[12]/Y"
CLOCK_NET: "bidir[12].pad/Y"
CLOCK_PERIOD: 62.5   # 16 MHz - MUST match the period the macro was hardened at

# CLOCK_PORT: clk_PAD
# CLOCK_NET: clk_pad/Y
# CLOCK_PERIOD: 40 # 25 MHz


# NOTE: DIE_AREA / CORE_AREA come from librelane/slots/slot_workshop.yaml
# (DIE 2935x2935, CORE 442..2493). Do NOT redefine them here or the logo
# placement expression and the padring geometry can disagree.



MAX_FANOUT_CONSTRAINT: 16
MAX_CAPACITANCE_CONSTRAINT: 0.4 # give more margin (max is 0.5)

# Fix hold violations
PL_RESIZER_HOLD_SLACK_MARGIN: 0.5
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.5

# Increase for more logic
# on your die
PL_TARGET_DENSITY_PCT: 40
GRT_ALLOW_CONGESTION: true

# Fix antenna violations after DRT
DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10 # %

# PDN - Straps
PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75

# PDN - Core ring
PDN_CORE_RING: True
# Maximum metal width without slotting: 30um
PDN_CORE_RING_VWIDTH: 25
PDN_CORE_RING_HWIDTH: 25
PDN_CORE_RING_CONNECT_TO_PADS: True
PDN_ENABLE_PINS: False
PDN_CORE_VERTICAL_LAYER: Metal2
PDN_CORE_HORIZONTAL_LAYER: Metal3

# Due to OpenROAD bug
# https://github.com/The-OpenROAD-Project/OpenROAD/issues/8229
#PL_TIME_DRIVEN: False
#PL_ROUTABILITY_DRIVEN: False

# Do not error on magic DRC violations
# Note: Passing magic DRC is not required for the submission.
# However, it is recommended to fix or carefully review all violations.
ERROR_ON_MAGIC_DRC: False

# Prevent false positive DRC errors in I/O cells
MAGIC_GDS_FLATGLOB:
# For contacts
- "*_CDNS_*"
# Foundry provided SRAMs
- "*$$*"
- "M1_N*"
- "M1_P*"
- "M2_M1*"
- "M3_M2*"
- "nmos_5p0*"
- "nmos_1p2*"
- "pmos_5p0*"
- "pmos_1p2*"
- "via1_*"
- "ypass_gate*"
- "G_ring_*"
# These additional cells must be flattened to get rid of 3.3V devices
# (DUALGATE drawn into high-level cells)
- "dcap_103*"
- "din_*"
- "mux821_*"
- "rdummy_*"
- "pmoscap_*"
- "xdec_*"
- "ypredec*"
- "xpredec*"
- "prexdec_*"
- "xdec8_*"
- "xdec16_*"
- "xdec32_*"
- "sa_*"

# Since we cannot meet the minimum density limit on Metal2,
# ignore active metal on previous and subsequent layers
# (DM.5_DM.7 and DM.4_DM.6). Dummy metal is moved to active
# metal during the precheck.
KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true

# Because we have multiple power pads for one power domain
MAGIC_EXT_UNIQUE: notopports

# spi_slave = Ascon-AEAD128 accelerator (Block A), hardened macro.
# chip_id is REQUIRED for tapeout; logo is optional.
MACROS:
  spi_slave:
    gds:
      - dir::../macro/gds/spi_slave.gds
    lef:
      - dir::../macro/lef/spi_slave.lef
    vh:
      - dir::../macro/vh/spi_slave.vh
    nl:
      - dir::../macro/nl/spi_slave.pnl.v
    spef:
      "max_*":
        - dir::../macro/spef/max/spi_slave.max.spef
      "min_*":
        - dir::../macro/spef/min/spi_slave.min.spef
      "nom_*":
        - dir::../macro/spef/nom/spi_slave.nom.spef
    
    lib:
      "nom_tt_025C_3v30":
        - dir::../macro/lib/nom_tt_025C_3v30/spi_slave__nom_tt_025C_3v30.lib
      "min_ff_n40C_3v60":
        - dir::../macro/lib/min_ff_n40C_3v60/spi_slave__min_ff_n40C_3v60.lib
      "max_ss_125C_3v00":
        - dir::../macro/lib/max_ss_125C_3v00/spi_slave__max_ss_125C_3v00.lib
    

    instances:
      i_chip_core.dut_ascon:
        location: [470.0, 1500.0]
        orientation: N
  # gf180mcu_ws_ip__id:
  #   gds:
  #     - dir::../ip/gf180mcu_ws_ip__id/gds/gf180mcu_ws_ip__id.gds
  #   lef:
  #     - dir::../ip/gf180mcu_ws_ip__id/lef/gf180mcu_ws_ip__id.lef
  #   vh:
  #     - dir::../ip/gf180mcu_ws_ip__id/vh/gf180mcu_ws_ip__id.v
  #   lib:
  #     "*":
  #       - dir::../ip/gf180mcu_ws_ip__id/lib/gf180mcu_ws_ip__id.lib
